[package]
name = "s-renderer"
version = "0.1.0"
edition = "2024"


[lib]
name = "s_renderer"
path = "src/lib.rs"



[dependencies]
netcdf = { version = "0.12", features = ["static"] }# Error handling
anyhow = "1.0"
thiserror = "2.0"
pollster = "0.4"
env_logger = "0.11"
# Serialization
serde = {version = "1.0",features = ["derive"]}


# Math
nalgebra = {version = "0.33",features = ["bytemuck"]}


# Array / scientific computing
ndarray = "0.16"



# GPU
wgpu = "26.0"


# Window
winit = "0.30"


# GPU data conversion
bytemuck = {version = "1.23",features = ["derive"]}



# Logging
log = "0.4"



[dev-dependencies]

env_logger = "0.11"

tokio = {version = "1",features = ["macros","rt-multi-thread"]}
[[example]]
name = "triangle"
path = "examples/triangle.rs"
[[example]]
name = "terrain"
path = "examples/terrain.rs"
