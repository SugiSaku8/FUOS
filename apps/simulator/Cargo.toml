[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
winit = "0.30"
wgpu = "26.0"
bytemuck = { version = "1.23", features = ["derive"] }
s-field = { path = "../../crates/s-field" }
s-sof = { path = "../../crates/s-sof" }
s-metal = { path = "../../crates/s-metal" }
s-cpu = { path = "../../crates/s-cpu" }
s-renderer = { path = "../../crates/s-renderer" }

# Native NetCDF input; static feature avoids a separate NetCDF runtime install.
netcdf = { version = "0.12", features = ["static"] }
# GeoTIFF reader. Install GDAL with Homebrew on macOS: brew install gdal
gdal = "0.18"
